[tox]
requires =
    tox>=4
envlist =
    {py310,py311,py312,py313,py314}
# Each CI matrix job installs only its own Python, so the other envs have no interpreter.
# Skip them instead of failing -- every version is still exercised by its own matrix job.
# Set explicitly rather than relying on the legacy-command default, which changed between
# tox 4.55 (skipped) and 4.58 (failed).
skip_missing_interpreters = true

[gh]
python =
    3.10 = py310
    3.11 = py311
    3.12 = py312
    3.13 = py313
    3.14 = py314

[testenv]
description = run tests
basepython =
    py310: python3.10
    py311: python3.11
    py312: python3.12
    py313: python3.13
    py314: python3.14
deps =
    poetry
commands_pre =
    poetry install --with dev
commands =
    poetry run pytest -n auto --cov vintasend_sqlalchemy --cov-report=xml:coverage-{envname}.xml {posargs}
