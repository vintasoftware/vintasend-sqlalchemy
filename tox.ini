[tox]
requires =
    tox>=4
envlist =
    # Each factor pairs a Python with the SQLAlchemy releases that support it.
    # SQLAlchemy 2.1+ requires Python 3.11.
    py310-sqlalchemy20
    {py311,py312,py313,py314}-{sqlalchemy20,sqlalchemy21}
# Each CI matrix job installs only its own Python, so the other envs have no interpreter.
# Skip them instead of failing -- every version is still exercised by its own matrix job.
# Set explicitly rather than relying on the legacy-command default, which changed between
# tox 4.55 (skipped) and 4.58 (failed).
skip_missing_interpreters = true

[gh]
python =
    3.10 = py310-sqlalchemy20
    3.11 = py311-{sqlalchemy20,sqlalchemy21}
    3.12 = py312-{sqlalchemy20,sqlalchemy21}
    3.13 = py313-{sqlalchemy20,sqlalchemy21}
    3.14 = py314-{sqlalchemy20,sqlalchemy21}

[testenv]
description = run tests
basepython =
    py310: python3.10
    py311: python3.11
    py312: python3.12
    py313: python3.13
    py314: python3.14
deps =
    poetry
commands_pre =
    # `poetry install` resolves SQLAlchemy from poetry.lock, which pins a single version.
    # The factor pin therefore has to be installed AFTER it -- installing it first
    # (via `deps`) means poetry silently replaces it and every env tests the locked
    # version instead of the one named in the env.
    poetry install --with dev
    sqlalchemy20: python -m pip install "SQLAlchemy>=2.0,<2.1"
    sqlalchemy21: python -m pip install "SQLAlchemy>=2.1,<2.2"
commands =
    poetry run pytest -n auto --cov vintasend_sqlalchemy --cov-report=xml:coverage-{envname}.xml {posargs}
